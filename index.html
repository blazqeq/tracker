<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAwesomes mest populære servere!</title>
    
    <link rel="icon" type="image/png" href="https://imgur.com/6oxhjln.png">
    
    <style>
        /* CSS Nulstilling & Globale styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        /* Header sektion */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.8rem;
            color: #0f172a;
            font-weight: 700;
        }

        .btn-refresh {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        /* Serverlisten / Accordion */
        .server-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .server-wrapper {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .server-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            cursor: pointer;
            user-select: none;
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rank {
            background: #e2e8f0;
            color: #475569;
            font-weight: 700;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50px;
            font-size: 0.9rem;
        }

        .server-wrapper:first-child .rank {
            background: #fef08a;
            color: #854d0e;
        }

        .server-name {
            font-weight: 600;
            color: #0f172a;
            font-size: 1.1rem;
        }

        .player-count {
            background: #dcfce7;
            color: #166534;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .player-panel {
            max-height: 0;
            opacity: 0;
            background-color: #ffffff;
            border-top: 0 solid #e2e8f0;
            transition: max-height 0.3s ease-out, opacity 0.2s ease, padding 0.3s ease;
            padding: 0 24px;
            overflow: hidden;
        }

        .server-wrapper.active .player-panel {
            max-height: 400px;
            opacity: 1;
            padding: 20px 24px;
            border-top: 1px solid #e2e8f0;
            overflow-y: auto;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .player-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            color: #334155;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid #e2e8f0;
        }

        .player-avatar {
            width: 20px;
            height: 20px;
            border-radius: 2px;
            image-rendering: pixelated;
        }

        .no-players, .status-msg {
            color: #94a3b8;
            font-style: italic;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>SuperAwesomes mest populære servere!</h1>
                <p style="color: #64748b; font-size: 0.9rem;">Klik på en server for at se online spillere</p>
            </div>
            <div>
                <button class="btn-refresh" id="refreshBtn">Opdater</button>
            </div>
        </header>

        <div class="server-list" id="serverContainer">
            <div class="status-msg">Henter servere...</div>
        </div>
    </div>

    <script>
        const apiURL = 'https://api.superawesome.dk/servers/';
        const container = document.getElementById('serverContainer');
        const refreshBtn = document.getElementById('refreshBtn');

        async function fetchServers() {
            container.innerHTML = '<div class="status-msg">Opdaterer listen...</div>';
            try {
                const response = await fetch(apiURL);
                if (!response.ok) throw new Error('Kunne ikke hente data');
                const data = await response.json();
                renderServers(data);
            } catch (error) {
                container.innerHTML = '<div class="status-msg" style="color: #ef4444;">Kunne ikke hente live data. Prøv igen om lidt.</div>';
            }
        }

        function renderServers(servers) {
            // Sikrer os at vi arbejder med et array uanset API-struktur
            let serverArray = Array.isArray(servers) ? servers : Object.values(servers);
            
            if (serverArray.length === 0) {
                container.innerHTML = '<div class="status-msg">Ingen aktive servere fundet.</div>';
                return;
            }

            // Sorter efter flest online spillere
            serverArray.sort((a, b) => (b.online || b.players || 0) - (a.online || a.players || 0));
            container.innerHTML = '';

            serverArray.forEach((server, index) => {
                const name = server.name || server.title || `Server #${index + 1}`;
                const onlinePlayers = server.online || server.players || 0;
                const maxPlayers = server.max || server.maxPlayers ? ` / ${server.max || server.maxPlayers}` : '';
                const rawPlayerList = server.playersData || [];
                
                let playerHTML = `<div class="no-players">Ingen spillere online.</div>`;
                if (rawPlayerList.length > 0) {
                    playerHTML = `<div class="player-grid">`;
                    rawPlayerList.forEach(player => {
                        playerHTML += `
                            <div class="player-tag">
                                <img src="https://skins.mcstats.com/skull/${player.uuid}" alt="" class="player-avatar" onerror="this.style.display='none'">
                                <span class="player-name-text">${player.username}</span>
                            </div>
                        `;
                    });
                    playerHTML += `</div>`;
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'server-wrapper';
                wrapper.innerHTML = `
                    <div class="server-card">
                        <div class="server-info">
                            <div class="rank">${index + 1}</div>
                            <div class="server-name">${name}</div>
                        </div>
                        <div class="player-count">${onlinePlayers}${maxPlayers} online</div>
                    </div>
                    <div class="player-panel">${playerHTML}</div>
                `;

                // Accordion klik-funktion
                wrapper.querySelector('.server-card').addEventListener('click', () => {
                    const isAlreadyActive = wrapper.classList.contains('active');
                    document.querySelectorAll('.server-wrapper').forEach(w => w.classList.remove('active'));
                    if (!isAlreadyActive) wrapper.classList.add('active');
                });

                container.appendChild(wrapper);
            });
        }

        // Start appen og bind opdater-knappen
        fetchServers();
        refreshBtn.addEventListener('click', fetchServers);
    </script>
</body>
</html>
