<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAwesome - Server Oversigt</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --bg-element: #0f172a;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --border-color: #334155;
            --border-radius: 12px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        @media (min-width: 768px) {
            header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .stats-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: var(--bg-element);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-pill strong {
            color: var(--accent);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .controls {
                grid-template-columns: 2fr 1fr auto auto;
            }
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .input-field {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        select.input-field {
            padding-left: 16px;
            cursor: pointer;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
        }

        .server-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 640px) {
            .server-grid {
                grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            }
        }

        .server-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .server-card:hover {
            transform: translateY(-4px);
            border-color: #475569;
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .favicon {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            background: var(--bg-element);
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .server-title {
            flex-grow: 1;
            min-width: 0;
        }

        .server-title h3 {
            font-size: 1.1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: capitalize;
        }

        .owner-badge {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-offline { background-color: var(--danger); }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-cat { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-vip { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-pro { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
        .badge-wl { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .motd-container {
            background: var(--bg-element);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.4;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 52px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            height: 8px;
            background: var(--bg-element);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .rate-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            width: 100%;
            max-width: 550px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .player-item {
            background: var(--bg-element);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .player-head {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-btn:hover { color: white; }

        .loader {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 16px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <div class="brand-logo">
                    <i class="fa-solid => fa-server"></i>
                </div>
                <div class="brand-text">
                    <h1>SuperAwesome Browser</h1>
                    <p>Live Minecraft Server Monitor</p>
                </div>
            </div>

            <div class="stats-summary">
                <div class="stat-pill">
                    <i class="fa-solid fa-gamepad" style="color:var(--accent)"></i>
                    Aktive Servere: <strong id="stat-servers">0</strong>
                </div>
                <div class="stat-pill">
                    <i class="fa-solid fa-users" style="color:var(--success)"></i>
                    Spillere Online: <strong id="stat-players">0</strong>
                </div>
            </div>
        </header>

        <!-- CORS Proxy Warning Notice (hidden by default) -->
        <div id="proxy-alert" class="alert" style="display: none;">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <div>
                <strong>CORS / HTTP Forbindelse:</strong> Henter data via en CORS Proxy fordi direkte API kald fra HTTPS til HTTP er begrænset i browseren.
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="input-field" placeholder="Søg efter servernavn, ejer eller MOTD...">
            </div>

            <select id="category-filter" class="input-field">
                <option value="all">Alle Kategorier</option>
            </select>

            <select id="sort-filter" class="input-field">
                <option value="players-desc">Flest Spillere</option>
                <option value="players-asc">Færrest Spillere</option>
                <option value="name-asc">Navn (A-Å)</option>
            </select>

            <button id="refresh-btn" class="btn">
                <i class="fa-solid fa-rotate-right"></i>
                Opdater
            </button>
        </div>

        <!-- Main Server Grid -->
        <div id="server-grid" class="server-grid">
            <div class="loader">
                <div class="spinner"></div>
                <p>Henter serverdata fra SuperAwesome...</p>
            </div>
        </div>
    </div>

    <!-- Modal for Players -->
    <div id="player-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-server-title">Online Spillere</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-player-list" class="modal-body">
                <!-- Players rendered here -->
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const DIRECT_API_URL = 'http://api.superawesome.dk/servers?size=100';
        // CORS Proxy fallback for HTTPS preview environments
        const PROXY_API_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(DIRECT_API_URL);

        let serversData = [];

        // DOM elements
        const serverGrid = document.getElementById('server-grid');
        const searchInput = document.getElementById('search-input');
        const categoryFilter = document.getElementById('category-filter');
        const sortFilter = document.getElementById('sort-filter');
        const refreshBtn = document.getElementById('refresh-btn');
        const proxyAlert = document.getElementById('proxy-alert');

        async function fetchServers() {
            serverGrid.innerHTML = `
                <div class="loader">
                    <div class="spinner"></div>
                    <p>Henter serverdata fra SuperAwesome...</p>
                </div>`;
            
            refreshBtn.disabled = true;

            try {
                let response;
                let usedProxy = false;

                // Try direct fetch first
                try {
                    response = await fetch(DIRECT_API_URL);
                } catch (e) {
                    // Fallback to CORS proxy if HTTP fails in HTTPS environment
                    console.warn("Direct HTTP fetch failed, trying CORS proxy fallback...", e);
                    response = await fetch(PROXY_API_URL);
                    usedProxy = true;
                }

                if (!response.ok) throw new Error('Netværksfejl under hentning af data');

                const data = await response.json();
                serversData = Array.isArray(data) ? data : [];

                proxyAlert.style.display = usedProxy ? 'flex' : 'none';

                populateCategoryDropdown();
                renderServers();
                updateStats();

            } catch (error) {
                console.error("Fejl ved hentning af servere:", error);
                serverGrid.innerHTML = `
                    <div class="loader">
                        <i class="fa-solid fa-circle-exclamation" style="font-size:2rem; color:var(--danger); margin-bottom:12px;"></i>
                        <p>Kunne ikke indlæse servere. Prøv igen senere.</p>
                        <p style="font-size:0.8rem; margin-top:8px; opacity:0.7;">${error.message}</p>
                    </div>`;
            } finally {
                refreshBtn.disabled = false;
            }
        }

        function populateCategoryDropdown() {
            const categories = new Set();
            serversData.forEach(s => {
                if (s.category) categories.add(s.category);
            });

            const currentVal = categoryFilter.value;
            categoryFilter.innerHTML = '<option value="all">Alle Kategorier</option>';
            
            Array.from(categories).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                categoryFilter.appendChild(opt);
            });

            categoryFilter.value = currentVal;
        }

        function updateStats() {
            document.getElementById('stat-servers').textContent = serversData.length;
            const totalPlayers = serversData.reduce((acc, curr) => acc + (curr.players || 0), 0);
            document.getElementById('stat-players').textContent = totalPlayers;
        }

        function getFilteredServers() {
            const query = searchInput.value.toLowerCase().trim();
            const selectedCat = categoryFilter.value;
            const sortMode = sortFilter.value;

            return serversData.filter(server => {
                const matchesSearch = 
                    (server.name && server.name.toLowerCase().includes(query)) ||
                    (server.serverOwnerName && server.serverOwnerName.toLowerCase().includes(query)) ||
                    (server.motdLine1 && server.motdLine1.toLowerCase().includes(query)) ||
                    (server.motdLine2 && server.motdLine2.toLowerCase().includes(query));

                const matchesCategory = selectedCat === 'all' || server.category === selectedCat;

                return matchesSearch && matchesCategory;
            }).sort((a, b) => {
                if (sortMode === 'players-desc') return (b.players || 0) - (a.players || 0);
                if (sortMode === 'players-asc') return (a.players || 0) - (b.players || 0);
                if (sortMode === 'name-asc') return (a.name || '').localeCompare(b.name || '');
                return 0;
            });
        }

        function renderServers() {
            const filtered = getFilteredServers();

            if (filtered.length === 0) {
                serverGrid.innerHTML = `
                    <div class="loader">
                        <i class="fa-solid fa-ghost" style="font-size:2rem; margin-bottom:12px;"></i>
                        <p>Ingen servere fundet ud fra dine søgekriterier.</p>
                    </div>`;
                return;
            }

            serverGrid.innerHTML = filtered.map((server, idx) => {
                const isOnline = server.status === 'online';
                const players = server.players || 0;
                const maxPlayers = server.maxPlayers || 100;
                const percent = Math.min(Math.round((players / maxPlayers) * 100), 100);

                // Favicon handling (Base64 vs default fallback)
                let faviconSrc = 'https://placehold.co/64x64/1e293b/94a3b8?text=MC';
                if (server.motdFavicon) {
                    faviconSrc = server.motdFavicon.startsWith('data:') 
                        ? server.motdFavicon 
                        : `data:image/png;base64,${server.motdFavicon}`;
                }

                return `
                    <div class="server-card">
                        <div class="card-header">
                            <img src="${faviconSrc}" class="favicon" alt="Icon" onerror="this.src='https://placehold.co/64x64/1e293b/94a3b8?text=MC'">
                            <div class="server-title">
                                <h3>${escapeHtml(server.name || 'Ukendt Server')}</h3>
                                <div class="owner-badge">
                                    <i class="fa-solid fa-user"></i>
                                    ${escapeHtml(server.serverOwnerName || 'Ukendt Ejer')}
                                </div>
                            </div>
                            <span class="status-dot ${isOnline ? 'status-online' : 'status-offline'}" title="${server.status}"></span>
                        </div>

                        <div class="badges">
                            ${server.category ? `<span class="badge badge-cat">${escapeHtml(server.category)}</span>` : ''}
                            ${server.pro ? `<span class="badge badge-pro">PRO</span>` : (server.vip ? `<span class="badge badge-vip">VIP</span>` : '')}
                            ${server.whitelist === 'true' || server.whitelist === true ? `<span class="badge badge-wl">Whitelist</span>` : ''}
                        </div>

                        <div class="motd-container">
                            <div>${escapeHtml(server.motdLine1 || '')}</div>
                            <div style="opacity:0.75; font-size:0.75rem;">${escapeHtml(server.motdLine2 || '')}</div>
                        </div>

                        <div class="progress-section">
                            <div class="progress-header">
                                <span>Spillere</span>
                                <span><strong>${players}</strong> / ${maxPlayers}</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <div class="rate-tag">
                                <i class="fa-solid fa-star" style="color:#fbbf24;"></i> Rating: ${server.rate ?? '0'}
                            </div>
                            ${(server.playersData && server.playersData.length > 0) ? `
                                <button class="btn btn-secondary" style="padding:6px 12px; font-size:0.8rem;" onclick="openPlayerModal(${idx})">
                                    <i class="fa-solid fa-users"></i> Se spillere
                                </button>
                            ` : '<span style="font-size:0.75rem; color:var(--text-muted);">Ingen online</span>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openPlayerModal(serverIndex) {
            const filtered = getFilteredServers();
            const server = filtered[serverIndex];

            if (!server || !server.playersData) return;

            document.getElementById('modal-server-title').textContent = `${server.name} (${server.playersData.length} online)`;
            
            const playerList = document.getElementById('modal-player-list');
            playerList.innerHTML = server.playersData.map(player => `
                <div class="player-item">
                    <img class="player-head" src="https://mc-heads.net/avatar/${player.username || 'Steve'}/24" onerror="this.src='https://placehold.co/24x24/1e293b/fff?text=P'">
                    <span style="font-size:0.9rem; font-weight:500;">${escapeHtml(player.username || 'Anonym')}</span>
                    ${player.pro ? `<span class="badge badge-pro" style="margin-left:auto;">PRO</span>` : (player.vip ? `<span class="badge badge-vip" style="margin-left:auto;">VIP</span>` : '')}
                </div>
            `).join('');

            document.getElementById('player-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('player-modal').classList.remove('active');
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        searchInput.addEventListener('input', renderServers);
        categoryFilter.addEventListener('change', renderServers);
        sortFilter.addEventListener('change', renderServers);
        refreshBtn.addEventListener('click', fetchServers);

        // Close modal when clicking background
        document.getElementById('player-modal').addEventListener('click', (e) => {
            if (e.target.id === 'player-modal') closeModal();
        });

        // Initialize dashboard on load
        window.onload = fetchServers;
    </script>
</body>
</html>
