<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperAwesome Server Tracker</title>
    
    <link rel="icon" type="image/png" href="https://imgur.com/6oxhjln.png">
    
    <style>
        /* CSS Nulstilling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            line-height: 1.6;
            padding: 40px 20px;
        }

        /* -------------------------------------------
            SERVER LISTE CONTAINER
        ------------------------------------------- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { font-size: 1.8rem; font-weight: 700; }
        .sub-header { color: #64748b; font-size: 0.9rem; margin-top: 5px; }

        .btn-refresh {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }

        .server-list { display: flex; flex-direction: column; gap: 12px; }
        .server-wrapper {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .server-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; cursor: pointer; user-select: none;
        }
        .server-info { display: flex; align-items: center; gap: 15px; }
        .rank {
            background: #e2e8f0; color: #475569; font-weight: 700;
            width: 30px; height: 30px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%;
        }
        .server-wrapper:first-child .rank { background: #fef08a; color: #854d0e; }
        .server-name { font-weight: 600; font-size: 1.1rem; }
        .player-count { background: #dcfce7; color: #166534; padding: 6px 14px; border-radius: 20px; font-weight: 700; }
        
        .player-panel {
            max-height: 0; opacity: 0; background-color: #ffffff;
            transition: all 0.3s ease; padding: 0 24px; overflow: hidden;
        }
        .server-wrapper.active .player-panel { max-height: 400px; opacity: 1; padding: 20px 24px; border-top: 1px solid #e2e8f0; overflow-y: auto; }
        
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .player-tag { display: flex; align-items: center; gap: 8px; background: #f1f5f9; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #e2e8f0; }
        .player-avatar { width: 20px; height: 20px; border-radius: 2px; }
        .status-msg { text-align: center; color: #64748b; font-style: italic; }
        .no-players { color: #94a3b8; font-style: italic; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>SuperAwesome Tracker</h1>
                <p class="sub-header">Klik på en server for at se online spillere</p>
            </div>
            <button class="btn-refresh" id="refreshBtn">Opdater</button>
        </header>
        <div class="server-list" id="serverContainer">
            <div class="status-msg">Henter servere...</div>
        </div>
    </div>

    <script>
        async function fetchServers() {
            const container = document.getElementById('serverContainer');
            container.innerHTML = '<div class="status-msg">Opdaterer...</div>';
            try {
                const res = await fetch('https://api.superawesome.dk/servers/');
                const data = await res.json();
                renderServers(Object.values(data));
            } catch (e) { container.innerHTML = '<div class="status-msg">Kunne ikke hente data.</div>'; }
        }

        function renderServers(servers) {
            const container = document.getElementById('serverContainer');
            container.innerHTML = '';
            servers.sort((a,b) => (b.players || 0) - (a.players || 0));

            servers.forEach((s, i) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'server-wrapper';
                const players = s.playersData || [];
                let playerHTML = players.length > 0 ? '<div class="player-grid">' + players.map(p => `
                    <div class="player-tag">
                        <img src="https://skins.mcstats.com/skull/${p.uuid}" class="player-avatar">
                        <span>${p.username}</span>
                    </div>`).join('') + '</div>' : '<div class="no-players">Ingen spillere online.</div>';

                wrapper.innerHTML = `
                    <div class="server-card">
                        <div class="server-info">
                            <div class="rank">${i+1}</div>
                            <div class="server-name">${s.name || 'Server'}</div>
                        </div>
                        <div class="player-count">${s.players || 0} online</div>
                    </div>
                    <div class="player-panel">${playerHTML}</div>`;
                
                wrapper.querySelector('.server-card').onclick = () => {
                    const active = wrapper.classList.contains('active');
                    document.querySelectorAll('.server-wrapper').forEach(w => w.classList.remove('active'));
                    if (!active) wrapper.classList.add('active');
                };
                container.appendChild(wrapper);
            });
        }

        fetchServers();
        document.getElementById('refreshBtn').onclick = fetchServers;
    </script>
</body>
</html>
